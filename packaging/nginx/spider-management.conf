# Example nginx config for spider-management
# Adjust paths and user as needed

upstream spider_mgmt {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name example.com  _;

    # Serve static files directly
    location /static/ {
        alias /opt/spider_management_system/staticfiles/;
        access_log off;
        expires max;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /opt/spider_management_system/media/;
        access_log off;
        expires max;
        add_header Cache-Control "public";
    }

    location / {
        include uwsgi_params;
        uwsgi_pass unix:///run/uwsgi/spider-management.sock;
        uwsgi_read_timeout 120s;
    }
}
