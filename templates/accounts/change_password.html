{% extends 'base_tailwind.html' %}

{% block title %}修改密码 - 数据管理系统{% endblock %}

{% block page_title %}修改密码{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-6">
  <div class="card-retro p-4">
    <div class="mb-3">
      <h5 class="text-lg font-semibold font-serif text-retro-heading"><i class="fas fa-key mr-2"></i> 修改密码</h5>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="old_password" class="text-sm text-muted">旧密码</label>
        <input type="password" class="w-full border rounded px-2 py-2" id="old_password" name="old_password" required>
      </div>
      <div class="mb-3">
        <label for="new_password" class="text-sm text-muted">新密码</label>
        <input type="password" class="w-full border rounded px-2 py-2" id="new_password" name="new_password" required>
        <div class="text-xs text-muted mt-1">密码长度至少6位</div>
      </div>
      <div class="mb-3">
        <label for="confirm_password" class="text-sm text-muted">确认新密码</label>
        <input type="password" class="w-full border rounded px-2 py-2" id="confirm_password" name="confirm_password" required>
      </div>
      <div class="flex justify-end space-x-2">
        <a href="{% url 'dashboard' %}" class="px-3 py-2 rounded border btn-retro-secondary">取消</a>
        <button type="submit" class="px-4 py-2 rounded bg-primary-600 text-white btn-retro">修改密码</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
