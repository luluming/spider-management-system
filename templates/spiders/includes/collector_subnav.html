{% load static %}
<nav class="collector-subnav flex flex-wrap gap-2 mb-4 pb-3 border-b border-blue-100">
  {% with name=request.resolver_match.url_name %}
  <a href="{% url 'app_collector_management' %}"
     class="px-3 py-1.5 rounded-md text-sm font-medium {% if name == 'app_collector_management' or name == 'app_collector_permissions' %}bg-blue-600 text-white{% else %}bg-white text-blue-700 border border-blue-200 hover:bg-blue-50{% endif %}">
    <i class="fas fa-user-cog mr-1"></i>账号与权限
  </a>
  <a href="{% url 'app_device_rebind_list' %}"
     class="px-3 py-1.5 rounded-md text-sm font-medium {% if name == 'app_device_rebind_list' %}bg-blue-600 text-white{% else %}bg-white text-blue-700 border border-blue-200 hover:bg-blue-50{% endif %}">
    <i class="fas fa-exchange-alt mr-1"></i>设备换绑审批
    {% if pending_rebind_count %}<span class="ml-1 px-1.5 py-0.5 text-xs rounded-full bg-red-500 text-white">{{ pending_rebind_count }}</span>{% endif %}
  </a>
  {% if name == 'app_collector_permissions' %}
  <span class="px-3 py-1.5 rounded-md text-sm font-medium bg-blue-100 text-blue-800 border border-blue-200">
    <i class="fas fa-key mr-1"></i>正在分配：{{ collector.username }}
  </span>
  {% endif %}
  {% endwith %}
</nav>
