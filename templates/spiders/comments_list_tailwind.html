{% extends 'base_tailwind.html' %}

{% block title %}评论数据 - 数据管理系统{% endblock %}
{% block page_title %}评论数据{% endblock %}

{% block content %}
<!-- Filters Section -->
<div class="bg-white shadow rounded-lg mb-6">
    <div class="px-6 py-4 border-b border-gray-200">
        <h3 class="text-lg font-medium text-gray-900 flex items-center">
            <i class="fas fa-filter text-blue-500 mr-2"></i>
            数据筛选
        </h3>
    </div>
    <div class="p-6">
        <form id="filter-form" method="get" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <!-- Platform Filter -->
            <div>
                <label for="platform" class="block text-sm font-medium text-gray-700 mb-1">平台</label>
                <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" id="platform" name="platform">
                    <option value="">全部平台</option>
                    {% for p in platforms %}
                    <option value="{{ p }}" {% if current_filters.platform == p %}selected{% endif %}>{{ p }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Project Filter -->
            <div>
                <label for="project" class="block text-sm font-medium text-gray-700 mb-1">项目</label>
                <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" id="project" name="project">
                    <option value="">全部项目</option>
                    {% for p in projects %}
                    <option value="{{ p }}" {% if current_filters.project == p %}selected{% endif %}>{{ p }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Date Filters -->
            <div>
                <label for="start_date" class="block text-sm font-medium text-gray-700 mb-1">开始日期</label>
                <input type="date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" id="start_date" name="start_date" value="{{ current_filters.start_date|default:'' }}">
            </div>

            <div>
                <label for="end_date" class="block text-sm font-medium text-gray-700 mb-1">结束日期</label>
                <input type="date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" id="end_date" name="end_date" value="{{ current_filters.end_date|default:'' }}">
            </div>

            <!-- Rating Filter -->
            <div>
                <label for="rating" class="block text-sm font-medium text-gray-700 mb-1">评分</label>
                <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" id="rating" name="rating">
                    <option value="">全部</option>
                    <option value="5" {% if current_filters.rating == "5" %}selected{% endif %}>5星</option>
                    <option value="4" {% if current_filters.rating == "4" %}selected{% endif %}>4星</option>
                    <option value="3" {% if current_filters.rating == "3" %}selected{% endif %}>3星</option>
                    <option value="2" {% if current_filters.rating == "2" %}selected{% endif %}>2星</option>
                    <option value="1" {% if current_filters.rating == "1" %}selected{% endif %}>1星</option>
                </select>
            </div>

            <!-- Keyword Search -->
            <div>
                <label for="keyword" class="block text-sm font-medium text-gray-700 mb-1">关键词</label>
                <input type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" id="keyword" name="keyword" placeholder="用户名或内容" value="{{ current_filters.keyword }}">
            </div>

            <!-- Sort Options -->
            <div>
                <label for="sort_by" class="block text-sm font-medium text-gray-700 mb-1">排序</label>
                <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" id="sort_by" name="sort_by">
                    <option value="-publishTime" {% if current_filters.sort_by == "-publishTime" %}selected{% endif %}>时间</option>
                    <option value="-rating" {% if current_filters.sort_by == "-rating" %}selected{% endif %}>评分</option>
                    <option value="-likeCount" {% if current_filters.sort_by == "-likeCount" %}selected{% endif %}>点赞</option>
                    <option value="-replyCount" {% if current_filters.sort_by == "-replyCount" %}selected{% endif %}>回复</option>
                </select>
            </div>

            <!-- Page Size -->
            <div>
                <label for="page_size" class="block text-sm font-medium text-gray-700 mb-1">每页显示</label>
                <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" id="page_size" name="page_size">
                    <option value="10" {% if current_filters.page_size == 10 %}selected{% endif %}>10</option>
                    <option value="20" {% if current_filters.page_size == 20 %}selected{% endif %}>20</option>
                    <option value="50" {% if current_filters.page_size == 50 %}selected{% endif %}>50</option>
                    <option value="100" {% if current_filters.page_size == 100 %}selected{% endif %}>100</option>
                </select>
            </div>
        </form>

        <div class="mt-4 flex flex-wrap gap-2">
            <button type="submit" form="filter-form" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                <i class="fas fa-search mr-2"></i>筛选
            </button>
            <button type="button" class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500" id="reset-filters">
                <i class="fas fa-undo mr-2"></i>重置
            </button>
            <button type="button" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500" id="export-data">
                <i class="fas fa-download mr-2"></i>导出
            </button>
        </div>
    </div>
</div>

<!-- Statistics Cards -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6" id="statistics-section">
    <div class="card-retro overflow-hidden shadow rounded-lg">
        <div class="p-5">
            <div class="flex items-center">
                <div class="flex-shrink-0">
                    <div class="w-8 h-8 bg-blue-500 rounded-md flex items-center justify-center">
                        <i class="fas fa-comments text-white"></i>
                    </div>
                </div>
                <div class="ml-5 w-0 flex-1">
                    <dl>
                        <dt class="text-sm font-medium text-gray-500 truncate font-serif">评论数量</dt>
                        <dd class="text-lg font-medium text-gray-900" id="stat-comments">-</dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>

    <div class="card-retro overflow-hidden shadow rounded-lg">
        <div class="p-5">
            <div class="flex items-center">
                <div class="flex-shrink-0">
                    <div class="w-8 h-8 bg-yellow-500 rounded-md flex items-center justify-center">
                        <i class="fas fa-star text-white"></i>
                    </div>
                </div>
                <div class="ml-5 w-0 flex-1">
                    <dl>
                        <dt class="text-sm font-medium text-gray-500 truncate font-serif">平均评分</dt>
                        <dd class="text-lg font-medium text-gray-900" id="stat-rating">-</dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>

    <div class="card-retro overflow-hidden shadow rounded-lg">
        <div class="p-5">
            <div class="flex items-center">
                <div class="flex-shrink-0">
                    <div class="w-8 h-8 bg-green-500 rounded-md flex items-center justify-center">
                        <i class="fas fa-thumbs-up text-white"></i>
                    </div>
                </div>
                <div class="ml-5 w-0 flex-1">
                    <dl>
                        <dt class="text-sm font-medium text-gray-500 truncate font-serif">总点赞数</dt>
                        <dd class="text-lg font-medium text-gray-900" id="stat-likes">-</dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>

    <div class="card-retro overflow-hidden shadow rounded-lg">
        <div class="p-5">
            <div class="flex items-center">
                <div class="flex-shrink-0">
                    <div class="w-8 h-8 bg-purple-500 rounded-md flex items-center justify-center">
                        <i class="fas fa-users text-white"></i>
                    </div>
                </div>
                <div class="ml-5 w-0 flex-1">
                    <dl>
                        <dt class="text-sm font-medium text-gray-500 truncate font-serif">活跃用户</dt>
                        <dd class="text-lg font-medium text-gray-900" id="stat-users">-</dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Comments Table -->
<div class="card-retro overflow-hidden shadow rounded-lg">
    <div class="px-6 py-4 border-b border-gray-200">
        <div class="flex justify-between items-center">
            <h3 class="text-lg font-medium text-gray-900 flex items-center font-serif text-retro-heading">
                <i class="fas fa-list text-blue-500 mr-2"></i>
                评论列表
            </h3>
            <div class="flex items-center space-x-2">
                <span class="text-sm text-gray-500">每页显示:</span>
                <select class="rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 text-sm" id="page_size_select" name="page_size">
                    <option value="10" {% if current_filters.page_size == 10 %}selected{% endif %}>10</option>
                    <option value="20" {% if current_filters.page_size == 20 %}selected{% endif %}>20</option>
                    <option value="50" {% if current_filters.page_size == 50 %}selected{% endif %}>50</option>
                    <option value="100" {% if current_filters.page_size == 100 %}selected{% endif %}>100</option>
                </select>
            </div>
        </div>
    </div>
    <div id="comments-list">
        {% include 'spiders/comments_list_content_tailwind.html' %}
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Platform change handler
  var platformEl = document.getElementById('platform');
  var projectSelect = document.getElementById('project');
  if (platformEl) {
    platformEl.addEventListener('change', function() {
      var platform = this.value;
      if (platform) {
        fetch('/get-projects-by-platform/?platform=' + encodeURIComponent(platform), { headers: { 'X-Requested-With': 'XMLHttpRequest' }})
          .then(function(resp){ return resp.json(); })
          .then(function(data){
            if (!projectSelect) return;
            projectSelect.innerHTML = '<option value="">全部项目</option>';
            data.forEach(function(project) {
              var opt = document.createElement('option'); opt.value = project; opt.textContent = project; projectSelect.appendChild(opt);
            });
          }).catch(function(){ if (projectSelect) projectSelect.innerHTML = '<option value="">全部项目</option>'; });
      } else {
        if (projectSelect) projectSelect.innerHTML = '<option value="">全部项目</option>';
      }
    });
  }

  // Reset filters
  var resetBtn = document.getElementById('reset-filters');
  if (resetBtn) resetBtn.addEventListener('click', function(){ var f = document.getElementById('filter-form'); if(f) f.reset(); window.location.href = window.location.pathname; });

  // Page size change
  var pageSizeSelect = document.getElementById('page_size_select');
  if (pageSizeSelect) pageSizeSelect.addEventListener('change', function(){ var url = new URL(window.location); url.searchParams.set('page_size', this.value); url.searchParams.set('page', '1'); window.location.href = url.toString(); });

  // AJAX pagination (delegation)
  document.addEventListener('click', function(e){ var a = e.target.closest('.pagination-link'); if (a) { e.preventDefault(); var page = a.dataset.page; var url = new URL(window.location); url.searchParams.set('page', page); window.location.href = url.toString(); } });

  function loadStatistics(){
    var form = document.getElementById('filter-form');
    var params = form ? new URLSearchParams(new FormData(form)).toString() : '';
    fetch('/get-statistics/?' + params, { headers: { 'X-Requested-With': 'XMLHttpRequest' }})
      .then(function(resp){ return resp.json(); })
      .then(function(data){
        var setText = function(id, text){ var el = document.getElementById(id); if(el) el.textContent = text; };
        setText('stat-comments', data.total_comments || '-');
        setText('stat-rating', data.avg_rating ? data.avg_rating.toFixed(1) : '-');
        setText('stat-likes', data.total_likes || '-');
        setText('stat-users', data.active_users || '-');
      }).catch(function(){});
  }

  loadStatistics();

  var filterForm = document.getElementById('filter-form');
  if (filterForm) {
    filterForm.querySelectorAll('select, input').forEach(function(el){ el.addEventListener('change', loadStatistics); });
  }
});
</script>
{% endblock %}
