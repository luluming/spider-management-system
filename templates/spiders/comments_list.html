{% extends 'base.html' %}

{% block title %}评论数据 - 数据管理系统{% endblock %}

{% block page_title %}评论数据{% endblock %}

{% block content %}
<!-- 筛选表单 -->
<div class="card mb-4">
    <div class="card-header">
        <h5 class="mb-0">
            <i class="fas fa-filter me-2"></i>
            数据筛选
        </h5>
    </div>
    <div class="card-body">
        <form id="filter-form" method="get">
            <div class="row">
                <!-- 平台筛选 -->
                <div class="col-md-2 mb-3">
                    <label for="platform" class="form-label">平台</label>
                    <select class="form-select" id="platform" name="platform">
                        <option value="">全部平台</option>
                        {% for p in platforms %}
                        <option value="{{ p }}" {% if current_filters.platform == p %}selected{% endif %}>{{ p }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- 项目筛选 -->
                <div class="col-md-2 mb-3">
                    <label for="project" class="form-label">项目</label>
                    <select class="form-select" id="project" name="project">
                        <option value="">全部项目</option>
                        {% for p in projects %}
                        <option value="{{ p }}" {% if current_filters.project == p %}selected{% endif %}>{{ p }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- 时间筛选 -->
                <div class="col-md-2 mb-3">
                    <label for="start_date" class="form-label">开始日期</label>
                    <input type="date" class="form-control" id="start_date" name="start_date" value="{{ current_filters.start_date|default:'' }}">
                </div>
                
                <div class="col-md-2 mb-3">
                    <label for="end_date" class="form-label">结束日期</label>
                    <input type="date" class="form-control" id="end_date" name="end_date" value="{{ current_filters.end_date|default:'' }}">
                </div>
                
                <!-- 评分筛选 -->
                <div class="col-md-1 mb-3">
                    <label for="rating" class="form-label">评分</label>
                    <select class="form-select" id="rating" name="rating">
                        <option value="">全部</option>
                        <option value="5" {% if current_filters.rating == "5" %}selected{% endif %}>5星</option>
                        <option value="4" {% if current_filters.rating == "4" %}selected{% endif %}>4星</option>
                        <option value="3" {% if current_filters.rating == "3" %}selected{% endif %}>3星</option>
                        <option value="2" {% if current_filters.rating == "2" %}selected{% endif %}>2星</option>
                        <option value="1" {% if current_filters.rating == "1" %}selected{% endif %}>1星</option>
                    </select>
                </div>
                
                <!-- 关键词搜索 -->
                <div class="col-md-2 mb-3">
                    <label for="keyword" class="form-label">关键词</label>
                    <input type="text" class="form-control" id="keyword" name="keyword" placeholder="用户名或内容" value="{{ current_filters.keyword }}">
                </div>
                
                <!-- 排序方式 -->
                <div class="col-md-1 mb-3">
                    <label for="sort_by" class="form-label">排序</label>
                    <select class="form-select" id="sort_by" name="sort_by">
                        <option value="-publishTime" {% if current_filters.sort_by == "-publishTime" %}selected{% endif %}>时间</option>
                        <option value="-rating" {% if current_filters.sort_by == "-rating" %}selected{% endif %}>评分</option>
                        <option value="-likeCount" {% if current_filters.sort_by == "-likeCount" %}selected{% endif %}>点赞</option>
                        <option value="-replyCount" {% if current_filters.sort_by == "-replyCount" %}selected{% endif %}>回复</option>
                    </select>
                </div>
            </div>
            
            <div class="row">
                <div class="col-12">
                    <button type="submit" class="btn btn-primary me-2">
                        <i class="fas fa-search me-1"></i>筛选
                    </button>
                    <button type="button" class="btn btn-secondary me-2" id="reset-filters">
                        <i class="fas fa-undo me-1"></i>重置
                    </button>
                    <button type="button" class="btn btn-success" id="export-data">
                        <i class="fas fa-download me-1"></i>导出
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- 统计信息 -->
<div class="row mb-4" id="statistics-section">
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card stat-card h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-uppercase mb-1">评论数量</div>
                        <div class="h5 mb-0 font-weight-bold" id="stat-comments">-</div>
                    </div>
                    <div class="col-auto">
                        <i class="fas fa-comments fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card stat-card success h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-uppercase mb-1">平均评分</div>
                        <div class="h5 mb-0 font-weight-bold" id="stat-rating">-</div>
                    </div>
                    <div class="col-auto">
                        <i class="fas fa-star fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card stat-card warning h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-uppercase mb-1">总点赞数</div>
                        <div class="h5 mb-0 font-weight-bold" id="stat-likes">-</div>
                    </div>
                    <div class="col-auto">
                        <i class="fas fa-thumbs-up fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-xl-3 col-md-6 mb-4">
        <div class="card stat-card info h-100 py-2">
            <div class="card-body">
                <div class="row no-gutters align-items-center">
                    <div class="col mr-2">
                        <div class="text-xs font-weight-bold text-uppercase mb-1">活跃用户</div>
                        <div class="h5 mb-0 font-weight-bold" id="stat-users">-</div>
                    </div>
                    <div class="col-auto">
                        <i class="fas fa-users fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 评论列表 -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">
            <i class="fas fa-list me-2"></i>
            评论列表
        </h5>
        <div class="d-flex align-items-center">
            <label for="page_size" class="form-label me-2 mb-0">每页显示:</label>
            <select class="form-select form-select-sm" id="page_size" name="page_size" style="width: auto;">
                <option value="10" {% if current_filters.page_size == 10 %}selected{% endif %}>10</option>
                <option value="20" {% if current_filters.page_size == 20 %}selected{% endif %}>20</option>
                <option value="50" {% if current_filters.page_size == 50 %}selected{% endif %}>50</option>
                <option value="100" {% if current_filters.page_size == 100 %}selected{% endif %}>100</option>
            </select>
        </div>
    </div>
    <div class="card-body" id="comments-list">
        {% include 'spiders/comments_list_content.html' %}
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    // 不设置默认日期，因为数据中的日期都是未来时间（2924年、2925年等）
    // 用户需要手动选择日期范围来查询数据
    
    // 平台选择变化时加载项目列表
    $('#platform').change(function() {
        var platform = $(this).val();
        var projectSelect = $('#project');
        
        if (platform) {
            projectSelect.prop('disabled', true).html('<option value="">正在加载项目列表...</option>');
            
            $.get('{% url "get_projects_by_platform" %}', {platform: platform}, function(data) {
                if (data.success) {
                    projectSelect.html('<option value="">全部项目</option>');
                    $.each(data.projects, function(index, project) {
                        projectSelect.append('<option value="' + project + '">' + project + '</option>');
                    });
                }
                projectSelect.prop('disabled', false);
            });
        } else {
            projectSelect.html('<option value="">全部项目</option>');
        }
    });
    
    // 筛选表单提交
    $('#filter-form').submit(function(e) {
        e.preventDefault();
        loadComments();
    });
    
    // 重置筛选条件
    $('#reset-filters').click(function() {
        $('#filter-form')[0].reset();
        $('#project').html('<option value="">全部项目</option>');
        loadComments();
    });
    
    // 页面大小变化
    $('#page_size').change(function() {
        loadComments();
    });
    
    // 导出数据
    $('#export-data').click(function() {
        var form = $('#filter-form');
        var url = '{% url "export_data" %}' + '?' + form.serialize() + '&format=excel';
        window.open(url, '_blank');
    });
    
    // 加载评论列表
    function loadComments() {
        var formData = $('#filter-form').serialize();
        formData += '&page_size=' + $('#page_size').val();
        
        $.ajax({
            url: '{% url "comments_list" %}',
            type: 'GET',
            data: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            },
            success: function(data) {
                $('#comments-list').html(data);
            },
            error: function() {
                $('#comments-list').html('<div class="alert alert-danger">加载数据失败，请重试</div>');
            }
        });
        
        // 更新统计数据
        updateStatistics();
    }
    
    // 更新统计数据
    function updateStatistics() {
        var formData = $('#filter-form').serialize();
        
        $.get('{% url "get_statistics" %}', formData, function(data) {
            if (data.success) {
                $('#stat-comments').text(data.statistics.total_comments);
                $('#stat-rating').text(data.statistics.avg_rating);
                $('#stat-likes').text(data.statistics.total_likes);
                $('#stat-users').text(data.statistics.active_users);
            }
        });
    }
    
    // 初始化统计数据
    updateStatistics();
});
</script>
{% endblock %}
