{% extends 'base.html' %}
{% load static %}

{% block title %}用户权限管理{% endblock %}

{% block extra_css %}
<style>
.permission-card {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.permission-table {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.permission-badge {
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.level-basic { background: #6c757d; color: white; }
.level-analyst { background: #007bff; color: white; }
.level-senior { background: #28a745; color: white; }
.level-admin { background: #dc3545; color: white; }
</style>
{% endblock %}

{% block content %}
<div class="main-content">
    <div class="container-fluid py-4">
        <!-- 页面头部 -->
        <div class="permission-card">
            <div class="row align-items-center">
                <div class="col-lg-8">
                    <h1 class="mb-2">
                        <i class="fas fa-user-shield me-3"></i>
                        用户权限管理中心
                    </h1>
                    <p class="mb-0 opacity-90">管理用户访问权限，控制功能模块的访问范围</p>
                </div>
                <div class="col-lg-4 text-end">
                    <div class="d-inline-flex align-items-center bg-white bg-opacity-20 px-3 py-2 rounded-pill">
                        <i class="fas fa-users-cog me-2"></i>
                        <span>权限管理员</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 功能导航 -->
        <div class="row mb-4">
            <div class="col-md-3 mb-3">
                <a href="{% url 'permission_management' %}" class="btn btn-primary w-100 py-3">
                    <i class="fas fa-list fa-2x mb-2"></i>
                    <div class="fw-bold">权限列表</div>
                    <small>查看所有用户权限</small>
                </a>
            </div>
            <div class="col-md-3 mb-3">
                <a href="{% url 'permission_access_log' %}" class="btn btn-info w-100 py-3">
                    <i class="fas fa-history fa-2x mb-2"></i>
                    <div class="fw-bold">访问日志</div>
                    <small>查看功能访问记录</small>
                </a>
            </div>
            <div class="col-md-3 mb-3">
                <a href="{% url 'permission_stats' %}" class="btn btn-success w-100 py-3">
                    <i class="fas fa-chart-bar fa-2x mb-2"></i>
                    <div class="fw-bold">统计报告</div>
                    <small>权限使用统计</small>
                </a>
            </div>
            <div class="col-md-3 mb-3">
                <a href="{% url 'sentiment_analysis' %}" class="btn btn-secondary w-100 py-3">
                    <i class="fas fa-brain fa-2x mb-2"></i>
                    <div class="fw-bold">情感分析</div>
                    <small>访问分析功能</small>
                </a>
            </div>
        </div>

        <!-- 用户权限表格 -->
        <div class="permission-table">
            <div class="p-4 border-bottom">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <h4 class="mb-0">
                            <i class="fas fa-users fa-sm me-2 text-primary"></i>
                            用户权限配置
                        </h4>
                    </div>
                    <div class="col-md-6">
                        <form method="get" class="d-flex gap-2">
                            <select name="level" class="form-select">
                                <option value="">全部级别</option>
                                <option value="basic">基础用户</option>
                                <option value="analyst">分析师</option>
                                <option value="senior_analyst">高级分析师</option>
                                <option value="admin">管理员</option>
                            </option>
                            <button type="submit" class="btn btn-outline-primary">
                                <i class="fas fa-filter"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-primary">
                        <tr>
                            <th>用户名</th>
                            <th>权限级别</th>
                            <th>基础分析</th>
                            <th>高级分析</th>
                            <th>数据导出</th>
                            <th>用户管理</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for profile in page_obj %}
                        <tr>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 40px; height: 40px;">
                                        <i class="fas fa-user text-white"></i>
                                    </div>
                                    <div>
                                        <div class="fw-bold">{{ profile.user.username }}</div>
                                        <small class="text-muted">{{ profile.user.email|default:"未设置邮箱" }}</small>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="permission-badge level-{{ profile.permission_level }}">
                                    {% if profile.permission_level == 'basic' %}基础用户
                                    {% elif profile.permission_level == 'analyst' %}分析师
                                    {% elif profile.permission_level == 'senior_analyst' %}高级分析师
                                    {% elif profile.permission_level == 'admin' %}管理员
                                    {% else %}{{ profile.permission_level }}
                                    {% endif %}
                                </span>
                            </td>
                            <td>
                                <span class="badge bg-{% if profile.can_view_basic_sentiment %}success{% else %}secondary{% endif %}">
                                    <i class="fas fa-{% if profile.can_view_basic_sentiment %}check{% else %}times{% endif %}"></i>
                                </span>
                            </td>
                            <td>
                                <span class="badge bg-{% if profile.can_view_advanced_sentiment %}success{% else %}secondary{% endif %}">
                                    <i class="fas fa-{% if profile.can_view_advanced_sentiment %}check{% else %}times{% endif %}"></i>
                                </span>
                            </td>
                            <td>
                                <span class="badge bg-{% if profile.can_export_data %}success{% else %}secondary{% endif %}">
                                    <i class="fas fa-{% if profile.can_export_data %}check{% else %}times{% endif %}"></i>
                                </span>
                            </td>
                            <td>
                                <span class="badge bg-{% if profile.can_manage_users %}success{% else %}secondary{% endif %}">
                                    <i class="fas fa-{% if profile.can_manage_users %}check{% else %}times{% endif %}"></i>
                                </span>
                            </td>
                            <td>
                                <a href="{% url 'edit_user_permission' profile.user.id %}" class="btn btn-outline-primary btn-sm">
                                    <i class="fas fa-edit me-1 small"></i>编辑
                                </a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="7" class="text-center py-5">
                                <i class="fas fa-users fa-3x text-muted mb-3"></i>
                                <p class="text-muted">没有找到用户权限配置</p>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

            <!-- 分页 -->
            {% if page_obj.has_other_pages %}
            <div class="p-4 border-top">
                <nav aria-label="权限管理分页">
                    <ul class="pagination justify-content-center mb-0">
                        {% if page_obj.has_previous %}
                        <li class="page-item">
                            <a class="page-link" href="?page=1{% if filter_level %}&level={{ filter_level }}{% endif %}">首页</a>
                        </li>
                        <li class="page-item">
                            <a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if filter_level %}&level={{ filter_level }}{% endif %}">上一页</a>
                        </li>
                        {% endif %}

                        {% for num in page_obj.paginator.page_range %}
                            {% if page_obj.number == num %}
                            <li class="page-item active">
                                <span class="page-link">{{ num }}</span>
                            </li>
                            {% elif num > page_obj.number|add:'-3' and num < page_obj.number|add:'3' %}
                            <li class="page-item">
                                <a class="page-link" href="?page={{ num }}{% if filter_level %}&level={{ filter_level }}{% endif %}">{{ num }}</a>
                            </li>
                            {% endif %}
                        {% endfor %}

                        {% if page_obj.has_next %}
                        <li class="page-item">
                            <a class="page-link" href="?page={{ page_obj.next_page_number }}{% if filter_level %}&level={{ filter_level }}{% endif %}">下一页</a>
                        </li>
                        <li class="page-item">
                            <a class="page-link" href="?page={{ page_obj.paginator.num_pages }}{% if filter_level %}&level={{ filter_level }}{% endif %}">末页</a>
                        </li>
                        {% endif %}
                    </ul>
                </nav>
            </div>
            {% endif %}
        </div>

        <!-- 快速操作面板 -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-light">
                        <h5 class="mb-0">
                            <i class="fas fa-cogs me-2"></i>
                            快速操作面板
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <button class="btn btn-outline-success w-100" onclick="bulkUpdate('promote_to_analyst')">
                                    <i class="fas fa-arrow-up me-2"></i>
                                    批量提升为分析师
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-outline-warning w-100" onclick="bulkUpdate('restrict_to_basic')">
                                    <i class="fas fa-arrow-down me-2"></i>
                                    批量降为基础用户
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-outline-info w-100" onclick="refreshPermissions()">
                                    <i class="fas fa-sync me-2"></i>
                                    刷新权限缓存
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function bulkUpdate(action) {
    if (confirm('确定要执行批量操作吗？')) {
        $.ajax({
            url: '{% url "bulk_permission_update" %}',
            method: 'POST',
            data: {
                action: action,
                csrfmiddlewaretoken: $('[name=csrfmiddlewaretoken]').val()
            },
            success: function(response) {
                if (response.success) {
                    alert(response.message);
                    location.reload();
                } else {
                    alert('操作失败: ' + response.message);
                }
            },
            error: function() {
                alert('操作失败，请重试');
            }
        });
    }
}

function refreshPermissions() {
    $.ajax({
        url: '{% url "check_user_permission" %}',
        success: function(data) {
            alert('权限缓存刷新完成');
        },
        error: function() {
            alert('刷新失败');
        }
    });
}
</script>
{% endblock %}
