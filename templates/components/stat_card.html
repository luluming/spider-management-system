{# stat_card.html - 包装小统计卡片 #}
<div class="card-soft p-4 flex items-center space-x-4">
  <div class="flex-shrink-0 h-12 w-12 rounded-lg flex items-center justify-center" style="background: {{ bg|default:'var(--color-primary-600)' }}; color: {{ fg|default:'#fff' }};">
    <i class="{{ icon }} text-lg"></i>
  </div>
  <div>
    <div class="text-xs font-semibold text-muted">{{ title }}</div>
    <div class="text-2xl font-bold mt-1">{{ value }}</div>
  </div>
</div>
